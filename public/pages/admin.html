<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrador — OficiosYA</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body{background:#F3F4F6;margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;}
    .admin-wrap{max-width:1200px;margin:0 auto;padding:32px 24px;}
    .admin-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px;}
    .admin-title{font-size:28px;font-weight:900;}
    .admin-sub{color:#6B7280;font-size:14px;}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
    .card{background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:18px;}
    .card-num{font-size:28px;font-weight:900;margin-bottom:4px;}
    .card-label{color:#6B7280;font-size:13px;}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
    .tab{border:none;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#fff;color:#374151;border:1px solid #E5E7EB;}
    .tab.active{background:#1D9E75;color:#fff;border-color:#1D9E75;}
    .panel{background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:18px;overflow:auto;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th,td{padding:10px;border-bottom:1px solid #E5E7EB;text-align:left;vertical-align:top;}
    th{font-size:12px;color:#6B7280;text-transform:uppercase;background:#F9FAFB;}
    .badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;}
    .b-ok{background:#D1FAE5;color:#065F46;}
    .b-warn{background:#FEF3C7;color:#92400E;}
    .b-danger{background:#FEE2E2;color:#991B1B;}
    .btn{border:none;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer;}
    .btn-green{background:#1D9E75;color:#fff;}
    .btn-red{background:#FEE2E2;color:#991B1B;}
    .top-btn{background:#111827;color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:600px){.grid{grid-template-columns:1fr;}.admin-head{flex-direction:column;align-items:flex-start;}}
  </style>
</head>
<body>

<div class="admin-wrap">
  <div class="admin-head">
    <div>
      <div class="admin-title">Panel Administrador</div>
      <div class="admin-sub" id="admin-name">Gestión general del sistema OficiosYA</div>
    </div>
    <button class="top-btn" onclick="cerrarSesion()">Cerrar sesión</button>
  </div>

  <div class="grid" id="resumen"></div>

  <div class="tabs">
    <button class="tab active" onclick="cambiarVista('usuarios', this)">Usuarios</button>
    <button class="tab" onclick="cambiarVista('solicitudes', this)">Solicitudes</button>
    <button class="tab" onclick="cambiarVista('postulaciones', this)">Postulaciones</button>
    <button class="tab" onclick="cambiarVista('calificaciones', this)">Calificaciones</button>
    <button class="tab" onclick="cambiarVista('verificaciones', this)">Verificaciones</button>
  </div>

  <div class="panel" id="contenido">Cargando...</div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/imagenes.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/notificaciones-ui.js"></script>
<script>
const sesion = getSession();

if (!sesion || !sesion.usuario || !(sesion.usuario.rol === 'admin' || sesion.usuario.is_admin === 1 || sesion.usuario.is_admin === true)) {
  alert('Acceso solo para administrador.');
  window.location.href = 'login.html';
}

document.getElementById('admin-name').textContent =
  `Administrador: ${sesion.usuario.nombres || sesion.usuario.nombre || 'heberon'} ${sesion.usuario.apellidos || ''}`;

async function adminFetch(endpoint, options = {}) {
  const token = getToken();

  const res = await fetch(`${API_URL}/admin${endpoint}`, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${token}`,
      ...(options.headers || {})
    }
  });

  const data = await res.json();

  if (!res.ok) {
    throw new Error(data.mensaje || data.error || 'Error administrativo.');
  }

  return data;
}

async function cargarResumen() {
  const data = await adminFetch('/resumen');
  const r = data.resumen;

  document.getElementById('resumen').innerHTML = `
    <div class="card"><div class="card-num">${r.total_usuarios || 0}</div><div class="card-label">Usuarios</div></div>
    <div class="card"><div class="card-num">${r.total_clientes || 0}</div><div class="card-label">Clientes</div></div>
    <div class="card"><div class="card-num">${r.total_trabajadores || 0}</div><div class="card-label">Trabajadores</div></div>
    <div class="card"><div class="card-num">${r.total_solicitudes || 0}</div><div class="card-label">Solicitudes</div></div>
    <div class="card"><div class="card-num">${r.solicitudes_abiertas || 0}</div><div class="card-label">Abiertas</div></div>
    <div class="card"><div class="card-num">${r.solicitudes_finalizadas || 0}</div><div class="card-label">Finalizadas</div></div>
    <div class="card"><div class="card-num">${r.solicitudes_canceladas || 0}</div><div class="card-label">Canceladas</div></div>
    <div class="card"><div class="card-num">${r.verificaciones_pendientes || 0}</div><div class="card-label">Verificaciones pendientes</div></div>
  `;
}

function badgeEstado(valor) {
  if (valor === 1 || valor === true || valor === 'aprobada' || valor === 'finalizada' || valor === 'aceptado') {
    return `<span class="badge b-ok">${valor}</span>`;
  }

  if (valor === 0 || valor === false || valor === 'rechazada' || valor === 'cancelada' || valor === 'rechazado') {
    return `<span class="badge b-danger">${valor}</span>`;
  }

  return `<span class="badge b-warn">${valor || 'pendiente'}</span>`;
}

async function cambiarVista(vista, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const cont = document.getElementById('contenido');
  cont.innerHTML = 'Cargando...';

  try {
    if (vista === 'usuarios') await cargarUsuarios();
    if (vista === 'solicitudes') await cargarSolicitudes();
    if (vista === 'postulaciones') await cargarPostulaciones();
    if (vista === 'calificaciones') await cargarCalificaciones();
    if (vista === 'verificaciones') await cargarVerificaciones();
  } catch (error) {
    cont.innerHTML = `<div style="color:#B91C1C;">${error.message}</div>`;
  }
}

async function cargarUsuarios() {
  const data = await adminFetch('/usuarios');
  const usuarios = data.usuarios || [];

  document.getElementById('contenido').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Estado</th><th>Verificado</th><th>Acción</th>
        </tr>
      </thead>
      <tbody>
        ${usuarios.map(u => `
          <tr>
            <td>${u.id}</td>
            <td>${u.nombres} ${u.apellidos}</td>
            <td>${u.email}</td>
            <td>${u.rol}</td>
            <td>${badgeEstado(u.estado)}</td>
            <td>${badgeEstado(u.verificado)}</td>
            <td>
              <button class="btn ${u.estado ? 'btn-red' : 'btn-green'}" onclick="cambiarEstadoUsuario(${u.id}, ${u.estado ? 0 : 1})">
                ${u.estado ? 'Desactivar' : 'Activar'}
              </button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function cambiarEstadoUsuario(id, estado) {
  await adminFetch(`/usuarios/${id}/estado`, {
    method: 'PUT',
    body: JSON.stringify({ estado })
  });

  await cargarUsuarios();
  await cargarResumen();
}

async function cargarSolicitudes() {
  const data = await adminFetch('/solicitudes');
  const solicitudes = data.solicitudes || [];

  document.getElementById('contenido').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Título</th><th>Cliente</th><th>Trabajador</th><th>Categoría</th><th>Estado</th><th>Presupuesto</th>
        </tr>
      </thead>
      <tbody>
        ${solicitudes.map(s => `
          <tr>
            <td>${s.id}</td>
            <td>${s.titulo}</td>
            <td>${s.cliente || '-'}</td>
            <td>${s.trabajador || '-'}</td>
            <td>${s.categoria || '-'}</td>
            <td>${badgeEstado(s.estado)}</td>
            <td>${s.presupuesto ? '$' + s.presupuesto : '-'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function cargarPostulaciones() {
  const data = await adminFetch('/postulaciones');
  const postulaciones = data.postulaciones || [];

  document.getElementById('contenido').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Solicitud</th><th>Trabajador</th><th>Precio</th><th>Disponibilidad</th><th>Estado</th>
        </tr>
      </thead>
      <tbody>
        ${postulaciones.map(p => `
          <tr>
            <td>${p.id}</td>
            <td>${p.solicitud}</td>
            <td>${p.trabajador}</td>
            <td>${p.precio_ofertado ? '$' + p.precio_ofertado : '-'}</td>
            <td>${p.disponibilidad || '-'}</td>
            <td>${badgeEstado(p.estado)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function cargarCalificaciones() {
  const data = await adminFetch('/calificaciones');
  const calificaciones = data.calificaciones || [];

  document.getElementById('contenido').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Solicitud</th><th>Calificador</th><th>Calificado</th><th>Puntuación</th><th>Comentario</th>
        </tr>
      </thead>
      <tbody>
        ${calificaciones.map(c => `
          <tr>
            <td>${c.id}</td>
            <td>${c.solicitud || '-'}</td>
            <td>${c.calificador || '-'}</td>
            <td>${c.calificado || '-'}</td>
            <td>⭐ ${c.puntuacion}</td>
            <td>${c.comentario || '-'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function cargarVerificaciones() {
  const data = await adminFetch('/verificaciones');
  const verificaciones = data.verificaciones || [];

  document.getElementById('contenido').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Usuario</th><th>Email</th><th>Documento</th><th>Estado</th><th>Acción</th>
        </tr>
      </thead>
      <tbody>
        ${verificaciones.map(v => `
          <tr>
            <td>${v.id}</td>
            <td>${v.usuario}</td>
            <td>${v.email}</td>
            <td>${v.documento_url || '-'}</td>
            <td>${badgeEstado(v.estado)}</td>
            <td>
              <button class="btn btn-green" onclick="gestionarVerificacion(${v.id}, 'aprobada')">Aprobar</button>
              <button class="btn btn-red" onclick="gestionarVerificacion(${v.id}, 'rechazada')">Rechazar</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function gestionarVerificacion(id, estado) {
  await adminFetch(`/verificaciones/${id}`, {
    method: 'PUT',
    body: JSON.stringify({
      estado,
      observacion: estado === 'aprobada' ? 'Aprobado por administrador.' : 'Rechazado por administrador.'
    })
  });

  await cargarVerificaciones();
  await cargarResumen();
}

function cerrarSesion() {
  localStorage.clear();
  sessionStorage.clear();
  window.location.href = 'login.html';
}

cargarResumen();
cargarUsuarios();
</script>

</body>
</html>
