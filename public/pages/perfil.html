<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil — OficiosYA</title>
  <link rel="stylesheet" href="../css/main.css">

  <style>
    body {
      margin: 0;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .perfil-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .perfil-card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    .perfil-header {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .perfil-foto {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #1D9E75;
      background: #e5e7eb;
    }

    .perfil-info h1 {
      margin: 0;
      font-size: 28px;
    }

    .perfil-info p {
      margin: 6px 0;
      color: #6b7280;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: #d1fae5;
      color: #065f46;
      font-size: 12px;
      font-weight: bold;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 11px;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary {
      background: #1D9E75;
      color: white;
    }

    .btn-light {
      background: #e5e7eb;
      color: #111827;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .foto-form {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .alert {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-weight: bold;
    }

    .alert.success {
      display: block;
      background: #d1fae5;
      color: #065f46;
    }

    .alert.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    @media(max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .perfil-header {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

<body>

<div class="perfil-container">

  <div id="alerta" class="alert"></div>

  <div class="perfil-card">
    <div class="perfil-header">
      <img id="foto-perfil" class="perfil-foto" src="../img/default-user.png" loading="lazy" alt="Foto de usuario">

      <div class="perfil-info">
        <h1 id="nombre-usuario">Cargando...</h1>
        <p id="correo-usuario"></p>
        <p id="rol-usuario"></p>
        <span class="badge" id="estado-verificacion">Verificando...</span>
      </div>
    </div>

    <form id="form-foto" class="foto-form" enctype="multipart/form-data">
      <input type="file" id="foto" name="foto" accept="image/jpeg,image/png,image/webp">
      <button type="submit" class="btn btn-primary">Subir foto</button>
    </form>
  </div>

  <div class="perfil-card">
    <h2>Datos personales</h2>

    <form id="form-datos">
      <div class="form-grid">
        <div class="form-group">
          <label>Nombres</label>
          <input type="text" id="nombres" required>
        </div>

        <div class="form-group">
          <label>Apellidos</label>
          <input type="text" id="apellidos" required>
        </div>

        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" id="telefono">
        </div>

        <div class="form-group">
          <label>Zona</label>
          <input type="text" id="zona">
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Guardar datos</button>
        <button type="button" class="btn btn-light" onclick="volver()">Volver</button>
      </div>
    </form>
  </div>

  <div class="perfil-card" id="card-profesional" style="display:none;">
    <h2>Perfil profesional</h2>

    <form id="form-profesional">
      <div class="form-grid">
        <div class="form-group">
          <label>Descripción</label>
          <textarea id="descripcion" placeholder="Describe tu experiencia y servicios..."></textarea>
        </div>

        <div class="form-group">
          <label>Experiencia</label>
          <textarea id="experiencia" placeholder="Ejemplo: 5 años en electricidad residencial..."></textarea>
        </div>

        <div class="form-group">
          <label>Tarifa referencial</label>
          <input type="number" id="tarifa_referencia" step="0.01" min="0">
        </div>

        <div class="form-group">
          <label>Disponibilidad</label>
          <input type="text" id="disponibilidad" placeholder="Ejemplo: Lunes a sábado">
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Guardar perfil profesional</button>
      </div>
    </form>
  </div>

</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/imagenes.js"></script>
<script src="../js/navbar.js"></script>

<script>
const sesion = getSession();

if (!sesion || !sesion.usuario) {
  window.location.href = 'login.html';
}

let usuarioActual = null;

function mostrarAlerta(mensaje, tipo = 'success') {
  const alerta = document.getElementById('alerta');
  alerta.textContent = mensaje;
  alerta.className = `alert ${tipo}`;

  setTimeout(() => {
    alerta.style.display = 'none';
    alerta.className = 'alert';
  }, 3500);
}

async function cargarPerfil() {
  try {
    const data = await Perfil.me();
    usuarioActual = data.usuario || data.perfil || data;

    document.getElementById('foto-perfil').src = imagenUsuario(usuarioActual);
    document.getElementById('nombre-usuario').textContent = `${usuarioActual.nombres || ''} ${usuarioActual.apellidos || ''}`;
    document.getElementById('correo-usuario').textContent = usuarioActual.email || '';
    document.getElementById('rol-usuario').textContent = `Rol: ${usuarioActual.rol || 'usuario'}`;

    document.getElementById('estado-verificacion').textContent =
      usuarioActual.verificado ? 'Usuario verificado' : 'Usuario no verificado';

    document.getElementById('nombres').value = usuarioActual.nombres || '';
    document.getElementById('apellidos').value = usuarioActual.apellidos || '';
    document.getElementById('telefono').value = usuarioActual.telefono || '';
    document.getElementById('zona').value = usuarioActual.zona || '';

    if (
      usuarioActual.rol === 'trabajador' ||
      usuarioActual.es_trabajador === true ||
      usuarioActual.es_trabajador === 1
    ) {
      document.getElementById('card-profesional').style.display = 'block';
      await cargarPerfilProfesional();
    }

  } catch (error) {
    mostrarAlerta(error.message || 'Error al cargar perfil.', 'error');
  }
}

async function cargarPerfilProfesional() {
  try {
    const data = await Perfil.profesional();
    const perfil = data.perfil || data.trabajador || data;

    document.getElementById('descripcion').value = perfil.descripcion || '';
    document.getElementById('experiencia').value = perfil.experiencia || '';
    document.getElementById('tarifa_referencia').value = perfil.tarifa_referencia || '';
    document.getElementById('disponibilidad').value = perfil.disponibilidad || '';

  } catch (error) {
    console.log('Perfil profesional aún no existe o no se pudo cargar.');
  }
}

document.getElementById('form-foto').addEventListener('submit', async function (e) {
  e.preventDefault();

  const input = document.getElementById('foto');

  if (!input.files || input.files.length === 0) {
    mostrarAlerta('Selecciona una imagen.', 'error');
    return;
  }

  const archivo = input.files[0];

  if (archivo.size > 3 * 1024 * 1024) {
    mostrarAlerta('La imagen es demasiado pesada. Máximo permitido: 3 MB.', 'error');
    return;
  }

  const formData = new FormData();
  formData.append('foto', archivo);

  try {
    const data = await Perfil.subirFoto(formData);

    if (data.usuario) {
      usuarioActual = {
        ...usuarioActual,
        ...data.usuario
      };

      document.getElementById('foto-perfil').src = imagenUsuario(usuarioActual);
    }

    input.value = '';
    mostrarAlerta('Foto actualizada correctamente.', 'success');

  } catch (error) {
    mostrarAlerta(error.message || 'Error al subir foto.', 'error');
  }
});

document.getElementById('form-datos').addEventListener('submit', async function (e) {
  e.preventDefault();

  const datos = {
    nombres: document.getElementById('nombres').value.trim(),
    apellidos: document.getElementById('apellidos').value.trim(),
    telefono: document.getElementById('telefono').value.trim(),
    zona: document.getElementById('zona').value.trim()
  };

  try {
    await Perfil.actualizarDatos(datos);
    mostrarAlerta('Datos actualizados correctamente.', 'success');
    await cargarPerfil();

  } catch (error) {
    mostrarAlerta(error.message || 'Error al actualizar datos.', 'error');
  }
});

document.getElementById('form-profesional').addEventListener('submit', async function (e) {
  e.preventDefault();

  const datos = {
    descripcion: document.getElementById('descripcion').value.trim(),
    experiencia: document.getElementById('experiencia').value.trim(),
    tarifa_referencia: document.getElementById('tarifa_referencia').value,
    disponibilidad: document.getElementById('disponibilidad').value.trim()
  };

  try {
    await Perfil.actualizarProfesional(datos);
    mostrarAlerta('Perfil profesional actualizado correctamente.', 'success');

  } catch (error) {
    mostrarAlerta(error.message || 'Error al actualizar perfil profesional.', 'error');
  }
});

function volver() {
  window.location.href = 'dashboard.html';
}

cargarPerfil();
</script>

</body>
</html>
