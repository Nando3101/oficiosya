<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar correo — OficiosYA</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    body {
      background: #F3F4F6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .verify-wrap {
      max-width: 520px;
      margin: 80px auto;
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
    }

    .verify-title {
      font-size: 24px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 10px;
    }

    .verify-text {
      color: #6B7280;
      font-size: 15px;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-block;
      padding: 12px 18px;
      background: #1D9E75;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
    }

    .error {
      color: #B91C1C;
      background: #FEE2E2;
      border: 1px solid #FCA5A5;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .success {
      color: #065F46;
      background: #D1FAE5;
      border: 1px solid #6EE7B7;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <div class="verify-wrap">
    <div class="verify-title">Verificación de correo</div>
    <div id="mensaje" class="verify-text">Verificando tu cuenta...</div>
    <a href="login.html" class="btn" id="btnLogin" style="display:none;">Ir a iniciar sesión</a>
  </div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/navbar.js"></script>
  <script>
    async function verificarCorreo() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const id = params.get('id');

      const mensaje = document.getElementById('mensaje');
      const btnLogin = document.getElementById('btnLogin');

      if (!token || !id) {
        mensaje.className = 'error';
        mensaje.textContent = 'El enlace de verificación no es válido.';
        btnLogin.style.display = 'inline-block';
        return;
      }

      try {
        const data = await Auth.verifyEmail(token, id);

        mensaje.className = 'success';
        mensaje.textContent = data.mensaje || 'Correo verificado correctamente.';

        btnLogin.style.display = 'inline-block';

      } catch (error) {
        mensaje.className = 'error';
        mensaje.textContent = error.message || 'No se pudo verificar el correo.';
        btnLogin.style.display = 'inline-block';
      }
    }

    verificarCorreo();
  </script>
</body>
</html>
