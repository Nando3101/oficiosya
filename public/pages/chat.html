<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chat — OficiosYA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/main.css">

  <style>
    body {
      margin: 0;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .chat-header {
      background: #111827;
      color: white;
      padding: 16px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-box {
      height: calc(100vh - 140px);
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 75%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    .mine {
      align-self: flex-end;
      background: #1D9E75;
      color: white;
    }

    .other {
      align-self: flex-start;
      background: white;
      color: #111827;
      border: 1px solid #e5e7eb;
    }

    .msg-date {
      display: block;
      margin-top: 4px;
      font-size: 10px;
      opacity: .7;
    }

    .chat-form {
      height: 70px;
      display: flex;
      gap: 8px;
      padding: 12px;
      background: white;
      border-top: 1px solid #e5e7eb;
      box-sizing: border-box;
    }

    .chat-form input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
    }

    .chat-form button {
      border: none;
      background: #1D9E75;
      color: white;
      border-radius: 12px;
      padding: 0 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .chat-form button:hover {
      background: #0f7d59;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 10px;
      margin: 12px;
      font-weight: bold;
    }

    .empty {
      color: #6b7280;
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<div class="chat-header">
  <span id="chat-title">Chat de solicitud</span>
  <button onclick="volver()" style="background:white;color:#111827;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:bold;">
    Volver
  </button>
</div>

<div class="chat-box" id="chat-box">
  <div class="empty">Cargando mensajes...</div>
</div>

<form class="chat-form" onsubmit="enviarMensaje(event)">
  <input type="text" id="mensaje" placeholder="Escribe un mensaje..." autocomplete="off">
  <button type="submit">Enviar</button>
</form>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/notificaciones-ui.js"></script>
<script src="../js/navbar.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const solicitudId = params.get('id');
const sesion = getSession();

let socket = null;

if (!sesion || !sesion.usuario) {
  window.location.href = 'login.html';
}

if (!solicitudId) {
  document.getElementById('chat-box').innerHTML = '<div class="error">No se recibió el ID de la solicitud.</div>';
}

function formatearFecha(valor) {
  if (!valor) return '';

  const fecha = new Date(valor);

  if (isNaN(fecha.getTime())) {
    return '';
  }

  return fecha.toLocaleString('es-EC', {
    hour: '2-digit',
    minute: '2-digit',
    day: '2-digit',
    month: '2-digit'
  });
}

function conectarSocket() {
  const socketUrl = window.SOCKET_URL;

  const script = document.createElement('script');
  script.src = `${socketUrl}/socket.io/socket.io.js`;

  script.onload = () => {
    socket = io(socketUrl);

    socket.emit('unirse_usuario', sesion.usuario.id);
    socket.emit('unirse_solicitud', solicitudId);

    socket.on('mensaje_recibido', (msg) => {
      pintarMensaje(msg);
    });

    socket.on('notificacion', (data) => {
      console.log('Notificación recibida:', data);
    });
  };

  script.onerror = () => {
    console.error('No se pudo cargar Socket.IO.');
  };

  document.head.appendChild(script);
}

async function cargarMensajes() {
  try {
    const data = await Chat.mensajes(solicitudId);

    if (data.solicitud && data.solicitud.titulo) {
      document.getElementById('chat-title').textContent = `Chat: ${data.solicitud.titulo}`;
    }

    const box = document.getElementById('chat-box');
    box.innerHTML = '';

    if (!data.mensajes || data.mensajes.length === 0) {
      box.innerHTML = '<div class="empty">Aún no hay mensajes. Escribe el primero.</div>';
    } else {
      data.mensajes.forEach(m => pintarMensaje(m));
    }

    await Chat.marcarLeido(solicitudId);

  } catch (error) {
    document.getElementById('chat-box').innerHTML = `<div class="error">${error.message}</div>`;
  }
}

function pintarMensaje(m) {
  const box = document.getElementById('chat-box');

  const empty = box.querySelector('.empty');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = Number(m.emisor_id) === Number(sesion.usuario.id)
    ? 'msg mine'
    : 'msg other';

  div.innerHTML = `
    ${m.mensaje || ''}
    <span class="msg-date">${formatearFecha(m.createdat || m.fecha)}</span>
  `;

  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function enviarMensaje(e) {
  e.preventDefault();

  const input = document.getElementById('mensaje');
  const texto = input.value.trim();

  if (!texto) return;

  input.value = '';

  try {
    await Chat.enviar(solicitudId, texto);
  } catch (error) {
    alert(error.message);
  }
}

function volver() {
  window.location.href = 'solicitudes.html';
}

if (solicitudId) {
  conectarSocket();
  cargarMensajes();
}
</script>

</body>
</html>
